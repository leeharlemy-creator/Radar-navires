name: Radar navires

on:
  schedule:
    # 1 fois par jour a 07:00 UTC (quota VesselAPI limite a 150/mois)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install requests

      - name: Lancer le radar
        env:
          VESSELAPI_KEY: ${{ secrets.VESSELAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_navires.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add navires_state.json
          git diff --staged --quiet || git commit -m "Mise a jour radar navires"
          git push
