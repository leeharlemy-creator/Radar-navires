name: Radar navires - Saye Armand

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-navires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install requests

      - name: Vérifier les navires et alerter si nouveauté
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_navires.py

      - name: Sauvegarder l'état pour la prochaine vérification
        run: |

          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add navires_state.json
          git diff --staged --quiet || git commit -m "Mise à jour état navires"
          git push
