name: Radar navires - Saye Armand

on:
  schedule:
    # Réduit à 2 fois par jour (7h et 19h UTC) au lieu de toutes les 3h,
    # pour paraître moins "robotique" face au blocage anti-scraping de
    # myshiptracking.com (erreur 403 apparue fin septembre 2026).
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  check-navires:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python check_navires.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add navires_state.json
          git diff --staged --quiet || git commit -m "Mise à jour état navires"
          git pull --rebase origin main
          git push
